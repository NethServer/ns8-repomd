---
# Since the introduction of the labels `org.nethserver.min-core` and
# `org.nethserver.min-from` in core 2.10, we can pin specific image tags
# to ensure they are always visible to clients, allowing for gradual
# upgrades between breaking releases.
core:
  - { tag: 2.9.6, prepend: True } # See #7040 #7047
mail:
  - { tag: 1.4.10, prepend: False } # Workaround #7211
  - { tag: 1.5.5, prepend: False } # Core 3.6.0
  - { match: "1.7.0", remove: True } # Bugs #7552 #7553
  - { match: "1.7.1", remove: True } # Bugs #7552 #7553
nextcloud:
  - { tag: 1.2.1, prepend: False } # from NC27 to NC28 #7225
  - { tag: 1.3.0, prepend: False } # from NC28 to NC29 #7347
  - { tag: 1.4.3, prepend: False } # from NC29 to NC30
  - { tag: 1.5.2, prepend: False } # from NC30 to NC31 #7728
  - { tag: 1.6.1, prepend: False } # from NC31 to NC32 #7928
  - { match: "1.7.0", remove: True } # NC33 withdrawal
  - { tag: 1.7.1, prepend: False } # from NC32 to NC33 #7986
mattermost:
  - { tag: 2.1.1, prepend: False } # MM 9.11 to 10.5 #7245
  - { tag: 2.2.0, prepend: False } # PG 13 to 17 #7628
nethvoice-proxy:
  - { tag: 1.2.0, prepend: False } # for core <3.6 #7350
nethvoice:
  - { tag: 1.2.1, prepend: False } # for core <3.6 #7350
  - { tag: 1.5.3, prepend: False } # for core <3.16 #7747
samba:
  - { tag: 2.5.0, prepend: False } # for core <3.9 #7384
webtop:
  - { tag: 1.4.5, prepend: False } # for tomcat and postgresql upgrade #7489
